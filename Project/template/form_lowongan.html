<div class="card">
  <h2>{{JUDUL_FORM}}</h2>
  <form method="post" action="index.php">
    <input type="hidden" name="page" value="lowongan">
    <input type="hidden" name="action" value="{{AKSI}}">
    <input type="hidden" name="id" value="{{ID}}">
    <label>Judul Lowongan <input type="text" name="judul" value="{{JUDUL}}" required></label>
    <label>Departemen <input type="text" name="departemen" value="{{DEPARTEMEN}}" required></label>
    <label>Lokasi <input type="text" name="lokasi" value="{{LOKASI}}" required></label>
    <label>Kuota <input type="number" name="kuota" min="1" value="{{KUOTA}}" required></label>
    <label>Status
      <select name="status">
        <option value="Buka" {{SEL_BUKA}}>Buka</option>
        <option value="Tutup" {{SEL_TUTUP}}>Tutup</option>
      </select>
    </label>
    <div class="form-aksi">
      <button class="btn" type="submit">Simpan</button>
      <a class="btn abu" href="index.php?page=lowongan">Batal</a>
    </div>
  </form>
</div>
